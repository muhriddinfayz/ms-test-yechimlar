<style>*{box-sizing:border-box}
body{margin:0;background:#0B1B3A;color:#fff;font:16px/1.4 "Segoe UI",Roboto,system-ui,sans-serif;min-height:100vh}
header{padding:36px 5vw 4px}h1{margin:0;font-size:clamp(28px,4vw,44px);font-weight:900;letter-spacing:-.01em}
h1 b{color:#FFC531}header p{margin:8px 0 0;color:#9FB3D9}
.wrap{padding:0 5vw}
.tabs{display:flex;gap:14px;flex-wrap:wrap;padding:22px 5vw 18px}
.tab{flex:1 1 260px;max-width:380px;display:flex;align-items:center;gap:16px;padding:16px 22px;border-radius:18px;
  border:2px solid #24407A;background:#13284F;color:#fff;font-family:inherit;font-size:24px;font-weight:800;
  line-height:1.15;text-align:left;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.tab:hover{transform:translateY(-2px)}
.tab .ico{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:#0B1B3A;
  color:#FFC531;font-size:28px;font-weight:900}
.tab small{display:block;margin-top:3px;font-size:14px;font-weight:600;color:#9FB3D9}
.tab.on{background:#FFC531;border-color:#FFC531;color:#0B1B3A}.tab.on small{color:#43517A}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{position:relative;display:block;background:#13284F;border-radius:14px;overflow:hidden;color:#fff;text-decoration:none;
  box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .15s,box-shadow .15s}
a.card:hover,a.card:focus{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.4);outline:none}
.card img{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#0E2247}
.card>span{display:block;padding:10px 14px;font-weight:800;font-size:17px}
.empty{padding:30px 0;color:#9FB3D9;font-size:18px}
footer{padding:34px 5vw 40px;color:#6F84AD;font-size:14px}

const grid = document.getElementById('grid'), msg = document.getElementById('msg'), tabs = document.querySelectorAll('.tab');
function render(){
  tabs.forEach(t => {
    t.classList.toggle('on', t.dataset.s === cur); t.setAttribute('aria-pressed', t.dataset.s === cur);
    t.querySelector('i').textContent = vis ? DECKS.filter(d => d.s === t.dataset.s && vis.has(d.c)).length : '…';
  });
  if (!vis) return;
  const list = DECKS.filter(d => d.s === cur && vis.has(d.c));
  grid.innerHTML = list.map(d => '<a class="card" href="' + d.h + '"><img src="images/' + d.c +
    '/thumb.webp" alt="" width="640" height="360" loading="lazy"><span>' + d.k + ' ' + d.n + '</span></a>').join('');
  msg.hidden = list.length > 0; msg.textContent = 'Hozircha bu bo‘limda prezentatsiya yo‘q.';
}
tabs.forEach(t => t.addEventListener('click', () => {
  cur = t.dataset.s; history.replaceState(null, '', cur === 'M' ? '#matematika' : '#fizika'); render();
}));
render();
fetch('visible.json?t=' + Date.now(), { cache: 'no-store' })
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(v => { vis = new Set(v.visible || []); render(); })
  .catch(() => {
    if (location.protocol === 'file:') { vis = new Set(DECKS.map(d => d.c)); render(); }
